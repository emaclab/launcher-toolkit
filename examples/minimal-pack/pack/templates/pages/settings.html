{#- Settings: each setting is a pack.json state variable with "persist": true. The renderer has
    no <select>, so the accent menu is a dropdown widget with one button per allowed value. The
    folder setting uses pick_folder and a tooltip. -#}
{%- set accents = ["blue", "green", "orange"] -%}
<div class="settings">
  <h1>{{ t("settings") }}</h1>
  <div class="setting">
    <div class="setting-text">
      <strong>{{ t("accent") }}</strong>
      <span class="hint">{{ t("accentHint") }}</span>
    </div>
    <div class="select" data-widget="dropdown" data-open="{{ state.accent_menu }}" data-on-close="set('accent_menu', false)">
      <button id="accent-button" class="select-button" aria-label="{{ t('accent') }}" aria-expanded="{{ state.accent_menu }}" data-on-click="toggle('accent_menu')">
        <span class="swatch" data-color="{{ state.accent }}"></span>
        <span>{{ t("accent." ~ state.accent) }}</span>
      </button>
      {%- if state.accent_menu %}
      <div class="select-menu" role="listbox" aria-label="{{ t('accent') }}" data-key="accent-menu">
        {%- for value in accents %}
        <button class="{{ 'select-option chosen' if value == state.accent else 'select-option' }}" role="option" aria-selected="{{ value == state.accent }}" data-on-click="set('accent', {{ value|arg }}); set('accent_menu', false); focus('#accent-button')">
          <span class="swatch" data-color="{{ value }}"></span>
          <span>{{ t("accent." ~ value) }}</span>
        </button>
        {%- endfor %}
      </div>
      {%- endif %}
    </div>
  </div>
  <div class="setting">
    <div class="setting-text">
      <strong>{{ t("details") }}</strong>
      <span class="hint">{{ t("detailsHint") }}</span>
    </div>
    <button class="switch" role="switch" aria-label="{{ t('details') }}" aria-checked="{{ state.details }}" data-on-click="toggle('details')"><span></span></button>
  </div>
  <div class="setting">
    <div class="setting-text">
      <span class="setting-title">
        <strong>{{ t("folder") }}</strong>
        <span class="tip-anchor">
          <button class="help" aria-label="{{ t('help') }}" aria-describedby="tip-folder" data-widget="tooltip" data-state="tip" data-value="folder">?</button>
          {%- if state.tip == "folder" %}
          <span id="tip-folder" class="tooltip" role="tooltip" data-key="tip-folder">{{ t("folderTip") }}</span>
          {%- endif %}
        </span>
      </span>
      <span class="hint">{{ state.folder or t("notSet") }}</span>
    </div>
    <div class="path-actions">
      {%- if state.folder %}
      <button class="button" data-key="clear-folder" data-on-click="set('folder', '')">{{ t("clear") }}</button>
      {%- endif %}
      <button class="button" data-key="choose-folder" data-on-click="pick_folder('folder')">{{ t("choose") }}</button>
    </div>
  </div>
  <div class="settings-footer">
    <span class="hint">{{ t("settingsSaved") }}</span>
    {#- null writes the pack.json default of each variable. -#}
    <button class="button" data-on-click="set('accent', null); set('details', null); set('folder', null); set('accent_menu', false)">{{ t("resetSettings") }}</button>
  </div>
</div>
